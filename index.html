<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cell atlas canvas POC</title>
    <!--
      Self-hosted Onest 700 (same-origin). SnapDOM embedFonts fetches the font
      file to inline it in the capture — Google Fonts is cross-origin and CORS-
      fails on some OSes, so sprites rasterize in a fallback while the DOM uses
      real Onest. Same-origin /fonts/*.woff2 → embed succeeds everywhere.
      MB-Onest is the fortunamania family name; both faces point at the same file.
    -->
    <style>
      @font-face {
        font-family: "Onest";
        src: url("/fonts/onest-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "MB-Onest";
        src: url("/fonts/onest-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
